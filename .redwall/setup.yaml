steps:
  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y cmake gcc g++ make patch tar
      sudo apt-get install -y \
        libbz2-dev \
        libdb-dev \
        libffi-dev \
        libgdbm-compat-dev \
        libgdbm-dev \
        libncursesw5-dev \
        libreadline-dev \
        libsqlite3-dev \
        libssl-dev \
        tcl-dev \
        tk-dev
