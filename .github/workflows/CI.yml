name: CI

on:
  pull_request:
  push:
    branches:
    - portable-python
  workflow_dispatch:
    inputs:
      verbose:
        required: false
        type: boolean

jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        python-version: [3.9.25, 3.10.19, 3.11.14, 3.12.12, 3.13.12]
        os: [ubuntu]
        include:
          - os: ubuntu
            runner: ubuntu-latest

    name: ${{ matrix.os }}-${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9 # v1.13.1
      with:
        cmake-version: 3.13.5

    - name: Build
      run: |
        mkdir -p python-build && mkdir -p python-install
        cd python-build
        cmake \
          ${{ inputs.verbose && '--trace-expand --debug-find' || '' }} \
          -DCMAKE_INSTALL_PREFIX:PATH=${{ github.workspace }}/python-install \
          -DPYTHON_VERSION=${{ matrix.python-version }} \
          ..
        make -j4 ${{ inputs.verbose && 'VERBOSE=1' || '' }}
        make install

    - name: Check sysconfig
      run: |
        ./python-install/bin/python -m sysconfig

    - name: Test
      run: |
        ./python-install/bin/python -m ensurepip || true
        ./python-install/bin/python -m pip install certifi || true
        ./python-install/bin/python -m test -v --timeout 60 || true

  all_tests_passed:
    needs: tests
    runs-on: ubuntu-latest
    name: All tests passed
    steps:
      - run: echo "Success"
